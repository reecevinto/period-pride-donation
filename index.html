<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate - Period Pride Kenya</title>
  
  <script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>

  <style>
    :root {
      --brand-pink: #d81b60;
      --brand-purple: #30005a;
      --brand-green: #68b36b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      color: #333;
    }

    .top-header {
      background-color: var(--brand-pink);
      height: 8px;
    }

    .container {
      max-width: 1000px;
      margin: 50px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 0 20px;
    }

    .visual-info h1 {
      color: var(--brand-purple);
      font-size: 36px;
    }

    .visual-info p {
      line-height: 1.6;
      font-size: 18px;
      color: #555;
    }

    .donation-card {
      background: #fff;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.05);
      border-top: 5px solid var(--brand-purple);
    }

    .input-box {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--brand-purple);
    }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #eee;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    input:focus {
      border-color: var(--brand-pink);
      outline: none;
    }

    .btn-mpesa {
      width: 100%;
      background-color: var(--brand-green);
      color: white;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-mpesa:hover { background-color: #569a59; }

    .divider {
      text-align: center;
      margin: 25px 0;
      color: #aaa;
      position: relative;
    }

    .divider::before, .divider::after {
      content: "";
      position: absolute;
      top: 50%; width: 42%; height: 1px; background: #ddd;
    }
    .divider::before { left: 0; } .divider::after { right: 0; }

    #status-msg {
      display: none;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
      font-weight: 600;
    }

    .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

    @media (max-width: 850px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="top-header"></div>

  <div class="container">
    <div class="visual-info">
      <h1>Support Our Initiatives</h1>
      <p>Your contribution directly supports menstrual health education and provides sanitary products to those in need across Kenya.</p>
      <img src="support.jpg" alt="Support Group" style="width:100%; border-radius:12px; border: 1px solid #eee;">
    </div>

    <div class="donation-card">
      <h2 style="text-align:center; margin-top:0;">Support Our Cause</h2>

      <div class="input-box">
        <label>Donation Amount (KES)</label>
        <input type="number" id="amount" value="1000">
      </div>

      <div class="input-box">
        <label>M-Pesa Phone Number</label>
        <input type="tel" id="phone" placeholder="2547XXXXXXXX">
      </div>

      <button class="btn-mpesa" onclick="initiateMpesa()">Donate now via M-PESA</button>

      <div class="divider">OR</div>

      <div id="paypal-button-container"></div>

      <div id="status-msg"></div>
    </div>
  </div>

  <script>
    const statusBox = document.getElementById('status-msg');

    function showStatus(msg, isSuccess) {
      statusBox.innerText = msg;
      statusBox.className = isSuccess ? 'success' : 'error';
      statusBox.style.display = 'block';
    }

    async function initiateMpesa() {
      const amount = document.getElementById('amount').value;
      const phone = document.getElementById('phone').value;

      if (!phone.startsWith('254') || phone.length !== 12) {
        showStatus("Please use format 2547XXXXXXXX", false);
        return;
      }

      showStatus("Requesting M-Pesa prompt... Please wait.", true);

      try {
        const response = await fetch('/api/stk_push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount, phone })
        });
        
        const data = await response.json();
        
        if(data.ResponseCode === "0") {
            showStatus("✔ STK Push sent! Please enter your PIN on your phone.", true);
        } else {
            showStatus("Error: " + (data.CustomerMessage || "Request failed"), false);
        }
      } catch (err) {
        showStatus("Connection error to backend. Ensure you are deploying to Vercel.", false);
      }
    }

    paypal.Buttons({
      createOrder: function(data, actions) {
        const ksh = document.getElementById('amount').value;
        const usd = (ksh / 130).toFixed(2); 
        return actions.order.create({
          purchase_units: [{ amount: { value: usd } }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          showStatus("Thank you for your donation, " + details.payer.name.given_name + "!", true);
        });
      }
    }).render('#paypal-button-container');
  </script>
</body>
</html>
